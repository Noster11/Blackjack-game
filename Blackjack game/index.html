<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="stylesheet" href="index.css">
   <title>document</title>
</head>

<body>
   <h1>Blackjack</h1>
   
   <main class="hands">
      <section class="hand hand-player">
         <h2>Your hand</h2>
         <p id="cards-el">Cards:</p>
         <p id="sum-el">Sum:</p>
      </section>
      <section class="hand hand-dealer">
         <h2>Dealer</h2>
         <p id="dealer-el">Cards:</p>
         <p id="dealerSum-el">Sum:</p>
      </section>
   </main>

   <p id="message-el">Want to play a hand?</p>


   <button onclick="reset()">reset</button>
   <button id="button-3" onclick="startGame()">deal a hand</button>
   <button class="body__button__1" id="button-1" onclick="hits()">hit</button>
   <button class="body__button__2" id="button-2" onclick="stands()">stand/dealer card</button>
   
   
   
   <script src="index.js"></script>


</body>

</html>
